  <link rel="manifest" href="manifest.json" />
  <title>Planning poker</title>
  <style>
    body {
      /* iOS PWA include the bottom unsafe area in svh */
      --vh: calc((100svh - env(safe-area-inset-bottom, 0)) / 100);
      --vw: calc(
        (
            100svw - env(safe-area-inset-left, 0) -
              env(safe-area-inset-right, 0)
          ) /
          100
      );
      background: #555;
      margin: auto env(safe-area-inset-right, auto) auto env(safe-area-inset-left, auto);
      position: relative;
      height: 100swh;
      height: calc(100 * var(--vh));
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
        sans-serif;
    }

    * {
      -webkit-user-select: none;
      user-select: none;
    }

    svg text {
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
        sans-serif;
    }

    button {
      -moz-appearance: none;
      -webkit-appearance: none;
      border-radius: 2svw;
      appearance: none;
      display: block;
      background: black;
      border: 1px solid yellow;
      color: yellow;
      cursor: pointer;
      margin: 0;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      transition:
        transform 0.5s,
        width 0.5s,
        height 0.5s,
        border-width 0.5s,
        top 0.5s,
        left 0.5s,
        border-radius 0.5s,
        color 0.5s,
        background-color 0.5s,
        z-index 0.5s step-end;
      position: absolute;
      z-index: 0;
      outline: 0;
      padding: 0;
      line-height: 0;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
    }

    button > svg {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      margin: auto;
      height: 100%;
      width: 100%;
      /* Prevent tooltips showing */
      pointer-events: none;
    }

    button:not([aria-expanded="true"]):focus {
      color: #fff;
      border-color: #fff;
    }

    @media (orientation: portrait) {
      button {
        width: 30svw;
        width: calc(var(--vw) * 30);
        height: calc((100svh - 15svw) / 5);
        height: calc((var(--vh) * 100) - (var(--vw) * 15)) / 5));
      }

      /* Vertical */
      button:where(:nth-of-type(-n + 3)) {
        top: 2.5svw;
        top: calc(var(--vw) * 2.5);
      }

      button:where(:nth-of-type(n + 4):nth-of-type(-n + 6)) {
        top: calc((100svh - 15svw) / 5 + 5svw);
        top: calc(((var(--vh) * 100) - (var(--vw) * 15)) / 5 + (var(--vw) * 5));
      }

      button:where(:nth-of-type(n + 7):nth-of-type(-n + 9)) {
        top: calc(2 * (100svh - 15svw) / 5 + 7.5svw);
        top: calc(2 * ((var(--vh) * 100) - (var(--vw) * 15)) / 5 + (var(--vw) * 7.5));
      }

      button:where(:nth-of-type(n + 10):nth-of-type(-n + 12)) {
        top: calc(3 * (100svh - 15svw) / 5 + 10svw);
        top: calc(3 * ((var(--vh) * 100) - (var(--vw) * 15)) / 5 + (var(--vw) * 10));
      }

      button:where(:nth-of-type(n + 13):nth-of-type(-n + 15)) {
        top: calc(4 * (100svh - 15svw) / 5 + 12.5svw);
        top: calc(4 * ((var(--vh) * 100) - (var(--vw) * 15)) / 5 + (var(--vw) * 12.5));
      }

      /* Horizontal */
      button:where(:nth-of-type(3n + 1)) {
        left: 2.5svw;
        left: calc(var(--vw) * 2.5);
      }

      button:where(:nth-of-type(3n + 2)) {
        left: 35svw;
        left: calc(var(--vw) * 35);
      }

      button:where(:nth-of-type(3n + 3)) {
        left: 67.5svw;
        left: calc(var(--vw) * 67.5);
      }
    }

    @media (orientation: landscape) {
      button {
        width: 17svw;
        width: calc(var(--vw) * 17);
        height: calc((100svh - 10svw) / 3);
        height: calc(((var(--vh) * 100) - (var(--vw) * 10)) / 3);
      }

      /* Vertical */
      button:where(:nth-of-type(-n + 5)) {
        top: 2.5svw;
        top: calc(var(--vw) * 2.5);
      }

      button:where(:nth-of-type(n + 6):nth-of-type(-n + 10)) {
        top: calc((100svh - 10svw) / 3 + 5svw);
        top: calc(((var(--vh) * 100) - (var(--vw) * 10)) / 3 + (var(--vw) * 5));
      }

      button:where(:nth-of-type(n + 11):nth-of-type(-n + 15)) {
        top: calc(2 * (100svh - 10svw) / 3 + 7.5svw);
        top: calc(2 * ((var(--vh) * 100) - (var(--vw) * 10)) / 3 + (var(--vw) * 7.5));
      }

      /* Horizontal */
      button:where(:nth-of-type(5n + 1)) {
        left: 2.5svw;
        left: calc(var(--vw) * 2.5);
      }

      button:where(:nth-of-type(5n + 2)) {
        left: 22svw;
        left: calc(var(--vw) * 22);
      }

      button:where(:nth-of-type(5n + 3)) {
        left: 41.5svw;
        left: calc(var(--vw) * 41.5);
      }

      button:where(:nth-of-type(5n + 4)) {
        left: 61svw;
        left: calc(var(--vw) * 61);
      }

      button:where(:nth-of-type(5n + 5)) {
        left: 80.5svw;
        left: calc(var(--vw) * 80.5);
      }
    }

    button[aria-expanded="true"] {
      border-radius: 4svw;
      border-radius: calc(var(--vw) * 4);
      width: 100%;
      height: 100%;
      left: 0;
      top: 0;
      font-weight: bold;
      border-width: 2svw;
      border-width: calc(var(--vw) * 2);
      transform: scaleX(0.8) scaleY(0.8);
      color: black;
      background: yellow;
      border-color: yellow;
      z-index: 1;
      transition:
        transform 0.5s,
        width 0.5s,
        height 0.5s,
        border-width 0.5s,
        top 0.5s,
        left 0.5s,
        border-radius 0.5s,
        color 0.5s,
        background-color 0.5s,
        z-index 0.5s step-start;
    }

    body:has(button[aria-expanded="true"]) {
      button:not([aria-expanded="true"]) {
        opacity: 0.5;
        filter: blur(5px);
        pointer-events: none;
      }
    }
  </style>

  <script>
    function speak(button) {
      if (!window.speechSynthesis) {
        return;
      }
      const text = button.getAttribute("aria-label") || button.innerText;
      const utterance = new SpeechSynthesisUtterance(text);
      speechSynthesis.speak(utterance);
    }

    function toggle(button) {
      document.querySelectorAll("button").forEach((b) => {
        if (b === button) {
          b.ariaExpanded = b.ariaExpanded ? undefined : true;
        } else {
          b.ariaExpanded = undefined;
        }
      });
    }

    const timeout = new WeakMap();

    document.addEventListener("click", (e) => {
      const button = e.target.closest("button");
      if (!button) {
        return;
      }
      e.preventDefault();
      if (button.ariaExpanded) {
        if (timeout.has(button)) {
          clearTimeout(timeout.get(button));
          timeout.delete(button);
          speak(button);
        } else {
          timeout.set(
            button,
            setTimeout(() => {
              timeout.delete(button);
              toggle(button);
            }, 200),
          );
        }
      } else {
        toggle(button);
      }
    });

    document.addEventListener("keyup", (e) => {
      if (e.key === "Escape") {
        document
          .querySelector("button[aria-expanded=true]")
          .forEach((el) => toggle(el));
      }
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./worker.js");
    }
  </script>
